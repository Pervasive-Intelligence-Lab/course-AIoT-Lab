; M5Stack AtomS3R-M12 -> eduroam -> realtime IMU stream
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor

[env:atoms3r-m12]
platform = espressif32 @ 6.12.0
board = m5stack-atoms3r
framework = arduino

monitor_speed = 115200
monitor_filters = direct
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified @ 0.2.20
